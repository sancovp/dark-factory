name: Dark Floor (autonomous beat)

# THE DARK FLOOR (Isaac 2026-08-10: "running full auto. dark floor."). A
# scheduled beat picks a subject (open kb-door issue → else deepen the
# coldest module → else a seed) and dispatches ONE round. The round
# self-merges through the CI/CD gate; the publisher ships the module PUBLIC.
# Nobody clicks anything. This only runs on the DEPLOYED line.
#
# SECURITY: a kb-door issue title is UNTRUSTED input. It is sanitized in
# kbworld/darkfloor.py (strip to [A-Za-z0-9 _-]) AND passed to the dispatch
# through $GITHUB_ENV — NEVER bash-interpolated via ${{ }} (which GitHub does
# not shell-escape). Two independent barriers; either alone suffices.
on:
  schedule:
    - cron: "17 */6 * * *"     # every 6h at :17 (off-minute by design)
  workflow_dispatch:

permissions:
  actions: write               # to dispatch the round workflow
  issues: write                # to CLOSE the kb-door it consumes
  contents: read

jobs:
  beat:
    # the documented kill switch governs the dark floor too
    if: github.repository == 'sancovp/dark-factory-live' && vars.FACTORY_ON == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pick a subject (sanitized → $GITHUB_ENV, never ${{ }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(python kbworld/darkfloor.py "$GITHUB_REPOSITORY")
          # darkfloor.py already stripped to [A-Za-z0-9 _-]; write to the
          # env file (opaque to the runner, masked in logs) so no untrusted
          # text ever re-enters a shell via ${{ }} interpolation.
          printf 'SUBJECT=%s\n' "$subject" >> "$GITHUB_ENV"
          echo "chosen: $subject"
      - name: dispatch one round
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run kb-round.yml -R "$GITHUB_REPOSITORY" \
            -f subject="$SUBJECT"
          echo "dispatched round: $SUBJECT"
