name: kb-round
on:
  workflow_dispatch:          # GRADE 1: human-dispatched only.
    inputs:
      subject:
        description: "Module subject to cultivate"
        required: true
  # schedule:                 # LATER (deity earns it): calendar-gated like
  #   - cron: "0 6 * * *"     # the deploy beat; see world/calendar.json
jobs:
  round:
    if: github.repository_owner == 'sancovp'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: prover + graph deps
        run: |
          sudo apt-get update && sudo apt-get install -y swi-prolog
          pip install kuzu pydantic pydantic-stack-core agent-skilltree
      - name: isaac stack (editable clones — data files guaranteed)
        env:
          STACK_PAT: ${{ secrets.STACK_PAT }}
        run: |
          git clone --depth 1 https://github.com/sancovp/brain-agent.git /tmp/brain-agent
          git clone --depth 1 -b ceo https://github.com/sancovp/map-v2.git /tmp/map-v2
          git clone --depth 1 -b ceo https://github.com/sancovp/cave-teams.git /tmp/cave-teams
          git clone --depth 1 "https://x-access-token:${STACK_PAT}@github.com/sancovp/ee-v2.git" /tmp/ee-v2
          pip install -e /tmp/map-v2 -e /tmp/cave-teams -e /tmp/ee-v2 -e /tmp/brain-agent
          pip install heaven-framework || true   # verify pin on first run
      - name: run one round (grade 1)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          HEAVEN_DATA_DIR: /tmp/heaven_data
          FACTORY_ON: ${{ vars.FACTORY_ON }}
        run: python -m kbworld.round "${{ github.event.inputs.subject }}" --grade1
      # TODO(fill): branch + PR step (reuse the factory's publish pattern)
