name: kb-round
on:
  workflow_dispatch:          # dispatched by the DARK FLOOR beat (darkfloor.yml,
    inputs:                   # every 6h) or by humans. FACTORY_ON=off kills it
      subject:                # at the beat AND inside run_round. The merge gate
        description: "Module subject to cultivate"   # is the reviewer chain.
        required: true
jobs:
  round:
    if: github.repository_owner == 'sancovp'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: git identity (the round commits its state)
        run: |
          git config user.name "kbworld"
          git config user.email "kbworld@dark-factory"
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: prover + graph deps
        run: |
          sudo apt-get update && sudo apt-get install -y swi-prolog
          pip install kuzu pydantic pydantic-stack-core agent-skilltree
      - name: isaac stack (PINNED — reproducible proofs; see kbworld/STACK_PINS.env)
        run: |
          set -a; source kbworld/STACK_PINS.env; set +a
          git clone https://github.com/sancovp/brain-agent.git /tmp/brain-agent && git -C /tmp/brain-agent checkout -q "$BRAIN_AGENT_SHA"
          git clone https://github.com/sancovp/map-v2.git /tmp/map-v2 && git -C /tmp/map-v2 checkout -q "$MAP_V2_SHA"
          git clone https://github.com/sancovp/cave-teams.git /tmp/cave-teams && git -C /tmp/cave-teams checkout -q "$CAVE_TEAMS_SHA"
          git clone https://github.com/sancovp/ee-v2.git /tmp/ee-v2 && git -C /tmp/ee-v2 checkout -q "$EE_V2_SHA"
          pip install -e /tmp/map-v2 -e /tmp/cave-teams -e /tmp/ee-v2 -e /tmp/brain-agent
          pip install heaven-framework || true   # verify pin on first run
      - name: run one round (grade 1)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          HEAVEN_DATA_DIR: /tmp/heaven_data
          FACTORY_ON: ${{ vars.FACTORY_ON }}
        run: python -m kbworld.round "${{ github.event.inputs.subject }}" --grade1
      # TODO(fill): branch + PR step (reuse the factory's publish pattern)
