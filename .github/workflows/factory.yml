name: dark-factory

on:
  schedule:
    - cron: "17 6 * * *"        # one autonomous cycle per day
  workflow_dispatch:
  pull_request:                  # selftest gates human PRs too
    paths-ignore: ["LINEAGE.json"]

permissions:
  contents: write
  pull-requests: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: keyless machinery proof (gate + racetrack + championship)
        run: python -m factory.run_cycle --selftest

  autonomous-cycle:
    # the real thing: the dev seat proposes, the gate kills, the RCT decides,
    # SHIP merges its own PR. Runs only on schedule/dispatch, never on PRs.
    if: github.event_name != 'pull_request'
    needs: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: run one factory cycle per car
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "dark-factory[bot]"
          git config user.email "dark-factory@users.noreply.github.com"
          python -m factory.run_cycle --ci
