name: dark-factory

on:
  schedule:
    - cron: "17 6 * * *"        # heartbeat: one autonomous cycle per day
  issues:
    types: [opened]              # an issue landing CONVENES the dev system
  workflow_dispatch:
  pull_request:                  # compose-check gates human PRs too
    paths-ignore: ["LINEAGE.json"]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  compose-check:
    # keyless: the full stack installs and the composition imports/builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: the composition builds (worlds, gate, racetrack — no LLM calls)
        run: |
          python - <<'EOF'
          from cave_teams.skillcraft import SkillcraftWorld, initial_state
          from cave_teams.darkfactory import CarKind, Championship, racetrack
          from cave_teams.examples import MiniMaxRuntime
          from factory.wos_team import WoSPlayer, WoSDeity
          from factory.gate import TEST_SH_PROMPT
          from factory import run_cycle
          assert "{skill_content}" in TEST_SH_PROMPT
          print("compose-check: cave-teams + heaven + factory wiring import clean")
          EOF

  autonomous-cycle:
    if: github.event_name != 'pull_request'
    needs: compose-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: one factory cycle (dev-world → gate → live racetrack → verdict)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          HEAVEN_DATA_DIR: ${{ runner.temp }}/heaven-data
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HEAVEN_DATA_DIR"
          git config user.name  "dark-factory[bot]"
          git config user.email "dark-factory@users.noreply.github.com"
          python -m factory.run_cycle --ci
