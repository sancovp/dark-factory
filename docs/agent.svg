<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- the fresh AI process -->
  <rect x="20" y="160" width="180" height="90" rx="14" fill="#1f6feb"/>
  <text x="110" y="196" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">a fresh AI process</text>
  <text x="110" y="218" text-anchor="middle" fill="#d3e4ff" font-size="12">(heaven MiniMax agent</text>
  <text x="110" y="234" text-anchor="middle" fill="#d3e4ff" font-size="12">with Bash + file tools)</text>

  <line x1="200" y1="205" x2="248" y2="205" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="224" y="192" text-anchor="middle" fill="#8b949e" font-size="12">runs in</text>

  <!-- the directory = the body -->
  <rect x="252" y="24" width="486" height="382" rx="16" fill="none" stroke="#8b949e" stroke-width="2.5"/>
  <text x="272" y="54" fill="#8b949e" font-size="14" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">world/agents/agent_001/</text>
  <text x="495" y="54" fill="#8b949e" font-size="12">— the agent's BODY</text>

  <!-- CLAUDE.md -->
  <rect x="276" y="74" width="438" height="52" rx="10" fill="#57606a"/>
  <text x="292" y="98" fill="#fff" font-size="13" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">CLAUDE.md</text>
  <text x="292" y="116" fill="#d0d7de" font-size="11.5">who this agent is — loaded the moment a process runs here</text>

  <!-- .claude/skills -->
  <rect x="276" y="140" width="438" height="128" rx="10" fill="#8250df"/>
  <text x="292" y="164" fill="#fff" font-size="13" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">.claude/skills/</text>
  <text x="292" y="182" fill="#e5d5ff" font-size="11.5">the equipped loadout (from World of Skillcraft's template):</text>
  <text x="304" y="203" fill="#fff" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">test_skill/          — run any skill through a fresh model</text>
  <text x="304" y="221" fill="#fff" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">skill_types/         — template · lens · recipe · persona…</text>
  <text x="304" y="239" fill="#fff" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">meta_prompt_eng…/    — verify, reflex-check, surface→process</text>
  <text x="304" y="257" fill="#fff" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">bug_report/ · execute_in_game/ · remember/ …</text>

  <!-- crafted -->
  <rect x="276" y="282" width="438" height="104" rx="10" fill="#1a7f37"/>
  <text x="292" y="306" fill="#fff" font-size="13" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">crafted/</text>
  <text x="292" y="324" fill="#c8f0d0" font-size="11.5">what the agent MAKES — real skill files, tradeable on the board</text>
  <text x="304" y="345" fill="#fff" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">my_new_skill.md</text>
  <text x="304" y="363" fill="#fff" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">.tests/test_a1b2c3.json   — the record trade_post requires</text>

  <!-- caption -->
  <text x="110" y="290" text-anchor="middle" fill="#8b949e" font-size="12" font-style="italic">give this directory to any</text>
  <text x="110" y="307" text-anchor="middle" fill="#8b949e" font-size="12" font-style="italic">fresh process — that</text>
  <text x="110" y="324" text-anchor="middle" fill="#8b949e" font-size="12" font-style="italic">process IS the agent</text>
</svg>
