<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- ⏰ daily cron -->
  <rect x="10" y="125" width="140" height="80" rx="14" fill="#6e40c9"/>
  <text x="80" y="158" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">⏰ daily cron</text>
  <text x="80" y="182" text-anchor="middle" fill="#e6d7ff" font-size="12">or manual dispatch</text>

  <line x1="150" y1="165" x2="196" y2="165" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 🤖 dev seat -->
  <rect x="200" y="115" width="200" height="100" rx="14" fill="#1f6feb"/>
  <text x="300" y="148" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">🤖 dev seat (AI)</text>
  <text x="300" y="172" text-anchor="middle" fill="#d3e4ff" font-size="12.5">sees: skill + failing inputs</text>
  <text x="300" y="190" text-anchor="middle" fill="#d3e4ff" font-size="12.5">never the answers</text>

  <line x1="400" y1="165" x2="446" y2="165" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="423" y="150" text-anchor="middle" fill="#8b949e" font-size="11.5">edit</text>

  <!-- 🚧 the gate -->
  <rect x="450" y="115" width="180" height="100" rx="14" fill="#9e6a03"/>
  <text x="540" y="148" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">🚧 the gate</text>
  <text x="540" y="172" text-anchor="middle" fill="#ffe8b0" font-size="12.5">execute in a sandbox</text>
  <text x="540" y="190" text-anchor="middle" fill="#ffe8b0" font-size="12.5">can't run ⇒ dead</text>

  <!-- death loop back to seat -->
  <path d="M 520 215 C 500 285, 340 285, 312 219" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="416" y="292" text-anchor="middle" fill="#8b949e" font-size="11.5">☠ dead — cause fed back, one retry</text>

  <line x1="630" y1="165" x2="676" y2="165" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="653" y="150" text-anchor="middle" fill="#8b949e" font-size="11.5">runs</text>

  <!-- 🏁 the race -->
  <rect x="680" y="110" width="190" height="110" rx="14" fill="#8250df"/>
  <text x="775" y="143" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">🏁 the race</text>
  <text x="775" y="167" text-anchor="middle" fill="#e5d5ff" font-size="12.5">A/B vs the incumbent</text>
  <text x="775" y="185" text-anchor="middle" fill="#e5d5ff" font-size="12.5">same battery, replicated</text>
  <text x="775" y="203" text-anchor="middle" fill="#e5d5ff" font-size="12.5">when the judge is noisy</text>

  <!-- strict win -> merged -->
  <path d="M 870 140 C 900 110, 910 95, 936 82" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="898" y="90" text-anchor="middle" fill="#8b949e" font-size="11.5">strict win</text>
  <rect x="940" y="35" width="170" height="90" rx="14" fill="#238636"/>
  <text x="1025" y="68" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">✅ PR MERGED</text>
  <text x="1025" y="92" text-anchor="middle" fill="#d2ffd8" font-size="12.5">by the bot itself,</text>
  <text x="1025" y="110" text-anchor="middle" fill="#d2ffd8" font-size="12.5">score in the title</text>

  <!-- tie/worse -> closed -->
  <path d="M 870 195 C 900 225, 910 240, 936 253" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="898" y="250" text-anchor="middle" fill="#8b949e" font-size="11.5">tie / worse</text>
  <rect x="940" y="210" width="170" height="90" rx="14" fill="#da3633"/>
  <text x="1025" y="243" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">❌ PR CLOSED</text>
  <text x="1025" y="267" text-anchor="middle" fill="#ffd7d5" font-size="12.5">verdict in the comment —</text>
  <text x="1025" y="285" text-anchor="middle" fill="#ffd7d5" font-size="12.5">a public receipt</text>
</svg>
