<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- center -->
  <text x="430" y="272" text-anchor="middle" fill="#8b949e" font-size="15" font-weight="700">the loop closes</text>
  <text x="430" y="294" text-anchor="middle" fill="#8b949e" font-size="12" font-style="italic">live play finds problems → problems summon the dev world →</text>
  <text x="430" y="312" text-anchor="middle" fill="#8b949e" font-size="12" font-style="italic">the shipped fix changes live play</text>

  <!-- 12 o'clock: LIVE PLAY -->
  <rect x="330" y="20" width="200" height="80" rx="14" fill="#1f6feb"/>
  <text x="430" y="52" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">▶ LIVE PLAY</text>
  <text x="430" y="74" text-anchor="middle" fill="#d3e4ff" font-size="11.5">the world runs on the current version</text>

  <!-- 3 o'clock: BUGS FOUND -->
  <rect x="620" y="150" width="210" height="90" rx="14" fill="#da3633"/>
  <text x="725" y="180" text-anchor="middle" fill="#fff" font-size="14.5" font-weight="700">🐛 BUGS FOUND IN-GAME</text>
  <text x="725" y="202" text-anchor="middle" fill="#ffd7d5" font-size="11.5">agents file reports (the bounty);</text>
  <text x="725" y="219" text-anchor="middle" fill="#ffd7d5" font-size="11.5">the deity validates them</text>

  <!-- 5 o'clock: GITHUB ISSUES -->
  <rect x="620" y="330" width="210" height="90" rx="14" fill="#57606a"/>
  <text x="725" y="360" text-anchor="middle" fill="#fff" font-size="14.5" font-weight="700">📋 GITHUB ISSUES</text>
  <text x="725" y="382" text-anchor="middle" fill="#d0d7de" font-size="11.5">the factory files each validated bug;</text>
  <text x="725" y="399" text-anchor="middle" fill="#d0d7de" font-size="11.5">`issues: opened` fires the workflow</text>

  <!-- 7 o'clock: DEV CONVENES -->
  <rect x="330" y="450" width="200" height="90" rx="14" fill="#8250df"/>
  <text x="430" y="480" text-anchor="middle" fill="#fff" font-size="14.5" font-weight="700">🛠 DEV-WORLD CONVENES</text>
  <text x="430" y="502" text-anchor="middle" fill="#e5d5ff" font-size="11.5">"WE NEED TO WORK TOGETHER</text>
  <text x="430" y="519" text-anchor="middle" fill="#e5d5ff" font-size="11.5">TO IMPROVE THE CODEBASE…"</text>

  <!-- 9 o'clock: THE GATES + SHIP -->
  <rect x="30" y="240" width="210" height="100" rx="14" fill="#238636"/>
  <text x="135" y="270" text-anchor="middle" fill="#fff" font-size="14.5" font-weight="700">🚧🏁 GATES → SHIP</text>
  <text x="135" y="292" text-anchor="middle" fill="#d2ffd8" font-size="11.5">market · fresh test · the race —</text>
  <text x="135" y="309" text-anchor="middle" fill="#d2ffd8" font-size="11.5">a strict win merges the PR;</text>
  <text x="135" y="326" text-anchor="middle" fill="#d2ffd8" font-size="11.5">the package is now different</text>

  <!-- ring arrows, clockwise -->
  <path d="M 534 78 C 610 100, 650 118, 686 146" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M 725 244 C 725 274, 725 296, 725 326" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M 660 424 C 610 452, 580 466, 534 482" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M 326 486 C 220 458, 160 410, 132 344" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M 140 236 C 170 150, 240 92, 326 62" fill="none" stroke="#8b949e" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- heartbeat: cron -->
  <rect x="30" y="30" width="170" height="64" rx="12" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="115" y="56" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="700">⏰ daily cron</text>
  <text x="115" y="76" text-anchor="middle" fill="#8b949e" font-size="11.5">the heartbeat — runs a cycle</text>
  <path d="M 200 76 C 250 110, 300 150, 356 104" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
</svg>
